; Bench firmware: a serial command shell for bring-up tests.
; Motors only run on explicit command, with a hard time cap.
[env:stickc-plus2]
platform = espressif32
board = m5stick-c
framework = arduino
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = default_8MB.csv
monitor_speed = 921600
upload_speed = 921600
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
lib_deps =
    m5stack/M5Unified
