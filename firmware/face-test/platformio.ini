; Standalone test firmware for the face (firmware/lib/face). It plays the 53 screen scenes on the robot with the
; motors stopped at boot and never run. Based on firmware/game-test/platformio.ini.
[env:stickc-plus2]
platform = espressif32
board = m5stick-c
framework = arduino
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = default_8MB.csv
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -O2
lib_deps =
    m5stack/M5Unified
    petconfig
lib_extra_dirs = ../lib
