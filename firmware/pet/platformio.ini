; The pet firmware: the egg and the hatching, Happy Birthday with the kid's name (set the names in
; ../lib/petconfig/src/pet_config.h), the face that reacts to being handled, golf, Trick Lab and seven animal dances,
; every motor run behind the guard in src/moves.cpp.
;
; Two builds:
;   dev  - Wi-Fi on at boot (the shell and updates over Wi-Fi), power saving off, motors on. For building and testing.
;   gift - Wi-Fi off unless the side button is held while it starts, motors on. The build to hand over: with Wi-Fi off
;          the face gets two frame buffers, and nothing on the robot talks to a network.
; PET_MOTORS=0 compiles the motors out (dances become lights and screen only).
; Versions are pinned so a later rebuild gives the same firmware.
[platformio]
default_envs = dev

[env]
platform = espressif32 @ 8.0.0
board = m5stick-c
framework = arduino
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = default_8MB.csv
monitor_speed = 921600
upload_speed = 921600
lib_extra_dirs = ../lib
lib_deps =
    m5stack/M5Unified @ 0.3.0
    m5stack/M5GFX @ 0.3.0
    face
    game
    petconfig
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -O2

[env:dev]
build_flags = ${env.build_flags} -DPET_WIFI_AT_BOOT=1 -DPET_MOTORS=1

[env:gift]
build_flags = ${env.build_flags} -DPET_WIFI_AT_BOOT=0 -DPET_MOTORS=1
